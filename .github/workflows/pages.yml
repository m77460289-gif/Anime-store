name: Deploy static site to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/supabase-client.js
          node --check assets/js/store.js
          node --check assets/js/admin.js
          node --check assets/js/coupons.js
          node --check assets/js/product.js
      - name: Prepare static website
        run: |
          mkdir -p dist
          cp *.html dist/
          cp -R admin dist/admin
          cp -R assets dist/assets
          printf '{"sha":"%s"}\n' "$GITHUB_SHA" > dist/deploy-version.json
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 2
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
