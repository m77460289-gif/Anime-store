services:
  - type: web
    name: niga-java-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: niga-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://m77460289-gif.github.io
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: niga-db
    plan: free
    databaseName: niga
    user: niga