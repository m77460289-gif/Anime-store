<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7fc">
<title>ورود مدیر | نیگا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#eee7ff 0,transparent 35%),linear-gradient(145deg,#f8f7fc,#f1edf9);font-family:Vazirmatn,Tahoma,sans-serif;color:#302b43;display:grid;grid-template-rows:auto 1fr}
.topbar{height:68px;padding:0 clamp(16px,5vw,60px);display:flex;align-items:center;justify-content:space-between;background:#ffffffd9;border-bottom:1px solid #e9e4f2}
.brand{font-weight:900;letter-spacing:2px;color:#7657d5;text-decoration:none}.brand small{display:block;font-size:10px;letter-spacing:0;color:#888197;font-weight:500}
.top-actions{display:flex;gap:10px;align-items:center}.top-actions a,.top-actions button{font:inherit;font-size:12px;text-decoration:none;border:1px solid #e5dfef;border-radius:10px;padding:9px 14px;background:#fff;color:#665a82;cursor:pointer}.top-actions #refreshAdmin{background:#f0ebff;border-color:#cfc0fa;color:#6045a5;font-weight:800}.top-actions #refreshAdmin[hidden]{display:none}
main{width:min(100% - 28px,460px);margin:auto;padding:45px 0}.login-card{background:#fff;border:1px solid #ebe6f3;border-radius:24px;padding:clamp(24px,6vw,42px);box-shadow:0 20px 55px #45336a12}
.mark{width:54px;height:54px;border-radius:17px;background:linear-gradient(135deg,#9b83ed,#eaa1ca);color:#fff;display:grid;place-items:center;font-size:25px;font-weight:900;box-shadow:0 9px 22px #7657d52b}
.kicker{margin:22px 0 4px;color:#8669c7;font-size:12px;font-weight:700}.login-card h1{font-size:25px;margin:0 0 8px}.hint{margin:0 0 25px;color:#827d91;font-size:13px;line-height:2}
label{display:grid;gap:8px;font-size:12px;font-weight:700;color:#5e596f}input{width:100%;height:50px;border:1px solid #e7e2ef;border-radius:12px;padding:0 14px;background:#faf9fd;color:#302b43;font:inherit;outline:0}input:focus{border-color:#a88fe9;box-shadow:0 0 0 3px #a88fe922}
.submit{width:100%;height:49px;margin-top:18px;border:0;border-radius:12px;background:linear-gradient(110deg,#8063dc,#d77aaf);color:white;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 9px 22px #7657d526}
.feedback{min-height:24px;margin:12px 0 0;color:#c34d77;font-size:12px}.reset-link{display:block;margin:14px auto 0;padding:7px 10px;border:0;background:transparent;color:#7657d5;font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.security-note{margin:16px 0 0;padding-top:14px;border-top:1px solid #f0edf5;color:#9993a6;font-size:10px;line-height:1.9}
#adminApp{display:none;min-height:calc(100vh - 68px)}.admin-frame{display:block;width:100%;height:calc(100vh - 68px);min-height:700px;border:0;background:#f7f7fc}
@media(max-width:600px){.topbar{height:60px}.top-actions a,.top-actions button{padding:8px 10px;font-size:10px}.admin-frame{height:calc(100vh - 60px);min-height:650px}#adminApp{min-height:calc(100vh - 60px)}}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="../index.html?store=1">NIGA<small>مدیریت فروشگاه</small></a><div class="top-actions"><a href="../index.html?store=1">مشاهده فروشگاه</a><button id="refreshAdmin" type="button" hidden>نسخه جدید آماده است؛ بروزرسانی</button><button id="logout" type="button" hidden>خروج از پنل</button></div></header>
<main id="loginView"><section class="login-card"><div class="mark">N</div><p class="kicker">ناحیه امن مدیریت</p><h1>ورود به پنل نیگا</h1><p class="hint">با ایمیل و رمز عبور حساب تأییدشدهٔ مدیر وارد شو.</p><form id="loginForm"><label for="adminEmail">ایمیل مدیر<input id="adminEmail" name="email" type="email" autocomplete="username" required autofocus dir="ltr" value="mohammadmatinhdadi@gmail.com"></label><label for="adminPassword" style="margin-top:14px">رمز عبور<input id="adminPassword" name="password" type="password" autocomplete="current-password" required></label><button class="submit" id="loginSubmit" type="submit">ورود به پنل مدیریت</button><button class="reset-link" id="forgotPassword" type="button">رمز عبورم را فراموش کرده‌ام</button><p class="feedback" id="feedback" role="alert"></p></form><form id="recoveryForm" hidden><label for="newPassword">رمز عبور جدید<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label><label for="confirmPassword" style="margin-top:14px">تکرار رمز عبور جدید<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label><button class="submit" id="savePassword" type="submit">ثبت رمز عبور جدید</button><p class="feedback" id="recoveryFeedback" role="alert"></p></form><p class="security-note">دسترسی مدیر از جدول profiles در پایگاه داده بررسی می‌شود؛ نقش ذخیره‌شده در مرورگر مبنای مجوز نیست.</p></section></main>
<section id="adminApp"><iframe class="admin-frame" title="پنل مدیریت فروشگاه نیگا" src="about:blank" id="adminFrame"></iframe></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<script src="../assets/js/supabase-client.js?v=20261128-supabase-auth-v1"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const client=window.nigaSupabase;
const ADMIN_CACHE="niga-demo-current-user";
let iframeEdited=false;
let updateCheckBusy=false;
const refreshButton=$("refreshAdmin");
function showApp(ok){
  $("loginView").style.display=ok?"none":"block";
  $("adminApp").style.display=ok?"block":"none";
  $("logout").hidden=!ok;
  const frame=$("adminFrame");
  if(ok){
    if(frame.dataset.loaded!=="yes"){
      frame.src="../index.html?admin=1&v=20261128-jalali-live-validation-v4";
      frame.dataset.loaded="yes";
      iframeEdited=false;
      refreshButton.hidden=true;
    }
  }else{
    frame.src="about:blank";
    delete frame.dataset.loaded;
    iframeEdited=false;
    refreshButton.hidden=true;
  }
 }

// نسخه هر انتشار از فایل deploy-version.json خوانده می‌شود.
let loadedDeployVersion="";
async function readDeployVersion(){
 try{
  const response=await fetch("../deploy-version.json?check="+Date.now(),{cache:"no-store"});
  if(!response.ok)return "";
  const data=await response.json();
  return data.sha||"";
 }catch(_error){return "";}
}
async function checkForNewVersion(){
 if(updateCheckBusy||$("adminApp").style.display==="none")return;
 updateCheckBusy=true;
 try{
  const latest=await readDeployVersion();
  if(latest&&loadedDeployVersion&&latest!==loadedDeployVersion)refreshButton.hidden=false;
 }finally{updateCheckBusy=false;}
}
$("adminFrame").addEventListener("load",async function(){
 if(!this.contentWindow||this.src==="about:blank")return;
 iframeEdited=false;
 loadedDeployVersion=await readDeployVersion();
 try{
  const doc=this.contentDocument;
  doc.addEventListener("input",()=>{iframeEdited=true},true);
  doc.addEventListener("change",()=>{iframeEdited=true},true);
 }catch(_error){}
 refreshButton.hidden=true;
});
refreshButton.addEventListener("click",function(){
 if(iframeEdited&&!window.confirm("ممکن است تغییرات ذخیره‌نشده از بین بروند. مطمئنی می‌خواهی نسخه جدید بارگذاری شود؟"))return;
 const frame=$("adminFrame");
 frame.src="../index.html?admin=1&v=20261128-jalali-live-validation-v4&refresh="+Date.now();
 iframeEdited=false;
 refreshButton.hidden=true;
});
setInterval(checkForNewVersion,30000);

async function verifyAdmin(user){
 if(!user)return false;
 const {data,error}=await client.from("profiles").select("id,full_name,role").eq("id",user.id).single();
 if(error)throw error;
 if(data.role!=="admin")return false;
 localStorage.setItem(ADMIN_CACHE,JSON.stringify({id:user.id,name:data.full_name||user.email.split("@")[0],email:user.email,role:"ADMIN"}));
 return true;
}
function showRecovery(){ $("loginForm").hidden=true; $("recoveryForm").hidden=false; $("feedback").textContent=""; $("recoveryFeedback").textContent="لینک بازیابی تأیید شد؛ رمز جدیدت را وارد کن."; }
async function checkSession(){
 if(!client){$("feedback").textContent=window.nigaSupabaseError||"اتصال به سرور برقرار نشد.";return}
 try{
  const {data,error}=await client.auth.getSession();if(error)throw error;
  if(data.session?.user && location.hash.includes("type=recovery")){showApp(false);showRecovery();return;}
  const ok=await verifyAdmin(data.session?.user);showApp(ok);
  if(!ok&&data.session?.user)$("feedback").textContent="این حساب دسترسی مدیر ندارد.";
 }catch(error){showApp(false);$("feedback").textContent=error.message||"بررسی دسترسی مدیر ناموفق بود."}
}
$("loginForm").addEventListener("submit",async function(event){
 event.preventDefault();if(!client){$("feedback").textContent=window.nigaSupabaseError||"اتصال به سرور برقرار نشد.";return}
 const button=$("loginSubmit");button.disabled=true;$("feedback").textContent="در حال ورود...";
 try{
  const email=$("adminEmail").value.trim().toLowerCase(),password=$("adminPassword").value;
  const {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;
  const ok=await verifyAdmin(data.user);
  if(!ok){await client.auth.signOut();localStorage.removeItem(ADMIN_CACHE);throw new Error("این حساب در نیگا نقش مدیر ندارد.")}
  $("feedback").textContent="";showApp(true);
 }catch(error){$("feedback").textContent=error.message==="Invalid login credentials"?"ایمیل یا رمز عبور درست نیست.":error.message||"ورود انجام نشد."}
 finally{button.disabled=false}
});
$("forgotPassword").addEventListener("click",async function(){
 if(!client){$("feedback").textContent=window.nigaSupabaseError||"اتصال به سرور برقرار نشد.";return;}
 const email=$("adminEmail").value.trim().toLowerCase();if(!email){$("feedback").textContent="ابتدا ایمیل مدیر را وارد کن.";return;}
 const button=$("forgotPassword");button.disabled=true;$("feedback").textContent="در حال ارسال لینک بازیابی...";
 try{const redirectTo=new URL("./",location.href).href;const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo});if(error)throw error;$("feedback").textContent="اگر این ایمیل در سامانه ثبت شده باشد، لینک بازیابی برایش ارسال می‌شود. پوشه هرزنامه را هم بررسی کن.";}catch(error){$("feedback").textContent=error.message||"ارسال لینک بازیابی انجام نشد.";}finally{button.disabled=false;}
});
$("recoveryForm").addEventListener("submit",async function(event){
 event.preventDefault();const password=$("newPassword").value,confirm=$("confirmPassword").value;
 if(password.length<8){$("recoveryFeedback").textContent="رمز باید حداقل ۸ کاراکتر باشد.";return;}if(password!==confirm){$("recoveryFeedback").textContent="تکرار رمز با رمز جدید یکسان نیست.";return;}
 const button=$("savePassword");button.disabled=true;$("recoveryFeedback").textContent="در حال ثبت رمز جدید...";
 try{const {data,error}=await client.auth.updateUser({password});if(error)throw error;$("recoveryFeedback").textContent="رمز عبور با موفقیت تغییر کرد. در حال ورود به پنل...";history.replaceState(null,"",location.pathname);const ok=await verifyAdmin(data.user);if(ok){$("recoveryForm").hidden=true;showApp(true);}else throw new Error("رمز تغییر کرد، اما این حساب نقش مدیر ندارد.");}
 catch(error){$("recoveryFeedback").textContent=error.message||"تغییر رمز انجام نشد.";}finally{button.disabled=false;}
});
$("logout").addEventListener("click",async function(){
 if(client)await client.auth.signOut();localStorage.removeItem(ADMIN_CACHE);showApp(false);$("adminPassword").value="";
});
if(client)client.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"){showApp(false);showRecovery();}if(event==="SIGNED_OUT"){localStorage.removeItem(ADMIN_CACHE);showApp(false)}});
checkSession();
})();
</script>
</body>
</html>
